<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treelizer – Disjoint Sets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-dark:#0f172a;
  --bg-panel:rgba(30,41,59,0.7);
  --primary:#3b82f6;
  --primary-glow:rgba(59,130,246,0.45);
  --accent:#06b6d4;
  --success:#10b981;
  --danger:#ef4444;
  --warning:#fbbf24;
  --text-main:#f1f5f9;
  --text-muted:#94a3b8;
  --border:rgba(148,163,184,0.2);
  --node-bg:rgba(15,23,42,0.88);
  --node-border:#3b82f6;
}
[data-theme="ocean"] {--bg-dark:#0a1628;--primary:#0ea5e9;--accent:#06b6d4;--node-border:#0ea5e9}
[data-theme="sunset"]{--bg-dark:#1a0f1e;--primary:#f97316;--accent:#ec4899;--node-border:#f97316}
[data-theme="forest"]{--bg-dark:#0f1a14;--primary:#22c55e;--accent:#84cc16;--node-border:#22c55e}
[data-theme="cyber"] {--bg-dark:#0d0d1a;--primary:#a855f7;--accent:#ec4899;--node-border:#a855f7}
[data-theme="amber"] {--bg-dark:#1a1410;--primary:#f59e0b;--accent:#eab308;--node-border:#f59e0b}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg-dark);
  background-image:
    radial-gradient(at 0% 0%,rgba(59,130,246,.13) 0,transparent 50%),
    radial-gradient(at 100% 100%,rgba(6,182,212,.13) 0,transparent 50%);
  color:var(--text-main);
  min-height:100vh;
  overflow:hidden;
  display:flex;
  transition:background-color .3s
}
.container{width:100%;display:flex;height:100vh}

aside{
  width:300px;background:var(--bg-panel);
  backdrop-filter:blur(12px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:18px;overflow-y:auto;
  z-index:10;gap:0
}
h1{
  font-size:1.4rem;font-weight:800;
  background:linear-gradient(to right,var(--primary),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:4px;text-align:center
}
.subtitle{font-size:.8rem;color:var(--text-muted);margin-bottom:20px;text-align:center}
.control-group{margin-bottom:18px}
.group-title{
  font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text-muted);margin-bottom:10px;font-weight:600
}
.theme-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
.theme-btn{
  padding:7px;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:6px;cursor:pointer;font-size:.68rem;color:var(--text-muted);
  transition:all .2s;font-weight:500;text-transform:uppercase;font-family:'Inter',sans-serif
}
.theme-btn:hover{background:rgba(255,255,255,.1)}
.theme-btn.active{background:var(--primary);color:white;border-color:var(--primary)}

input[type="text"],input[type="number"]{
  width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border);
  padding:9px;border-radius:8px;color:white;
  font-family:'JetBrains Mono',monospace;margin-bottom:7px;transition:.2s;font-size:.9rem
}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
select{
  width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);
  padding:9px;border-radius:8px;color:white;font-family:'Inter',sans-serif;
  font-size:.85rem;margin-bottom:7px;cursor:pointer;transition:.2s;-webkit-appearance:none
}
select:focus{outline:none;border-color:var(--primary)}
select option{background:#1e293b}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{
  padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text-main);cursor:pointer;
  font-size:.82rem;font-weight:500;transition:all .2s;font-family:'Inter',sans-serif
}
button:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
button:active{transform:translateY(0)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:white}
.btn-primary:hover{background:#2563eb;box-shadow:0 4px 12px var(--primary-glow)}
.btn-danger{color:var(--danger);border-color:rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.1)}
.btn-full{grid-column:1/-1}
.btn-warn{color:var(--warning);border-color:rgba(251,191,36,.3)}
.btn-warn:hover{background:rgba(251,191,36,.08)}

.terminal-panel{
  background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;
  padding:10px;font-family:'JetBrains Mono',monospace;font-size:.72rem;
  color:var(--text-main);max-height:130px;overflow-y:auto;line-height:1.5
}
.terminal-line{margin-bottom:3px;color:var(--text-muted)}
.terminal-line.success{color:var(--success)}
.terminal-line.error{color:var(--danger)}
.terminal-line.warn{color:var(--warning)}

.stats-panel{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  background:rgba(0,0,0,.2);padding:12px;border-radius:12px;margin-top:auto
}
.stat-item{display:flex;flex-direction:column}
.stat-label{font-size:.68rem;color:var(--text-muted)}
.stat-value{font-size:1rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent)}

.back-link{
  display:inline-block;margin-bottom:13px;padding:7px 11px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:6px;color:var(--primary);text-decoration:none;
  font-size:.82rem;transition:all .2s
}
.back-link:hover{background:rgba(255,255,255,.1)}

/* separator */
.sep{border:none;border-top:1px solid var(--border);margin:8px 0 14px}

/* list selector */
.list-selector{
  display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px
}
.list-pill{
  padding:4px 10px;border-radius:20px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text-muted);
  cursor:pointer;font-size:.75rem;font-weight:600;transition:all .2s
}
.list-pill:hover{background:rgba(255,255,255,.09)}
.list-pill.active{background:var(--primary);color:white;border-color:var(--primary)}

/* pointer color pickers row */
.ptr-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ptr-label{font-size:.78rem;color:var(--text-muted);flex:1}
.ptr-color{width:28px;height:22px;border-radius:4px;border:1px solid var(--border);cursor:pointer;padding:0}

/* checkbox row */
.chk-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:.8rem;color:var(--text-muted)}
.chk-row input[type="checkbox"]{accent-color:var(--primary);width:14px;height:14px}

main{
  flex:1;position:relative;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:40px 40px;
  overflow:hidden;cursor:grab
}
main:active{cursor:grabbing}
canvas{display:block}

.toast{
  position:absolute;bottom:28px;right:28px;padding:11px 18px;
  background:var(--bg-panel);border:1px solid var(--border);
  border-left:4px solid var(--primary);border-radius:8px;
  backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.3);
  transform:translateY(100px);opacity:0;
  transition:all .4s cubic-bezier(.175,.885,.32,1.275);
  z-index:100;pointer-events:none;font-size:.88rem
}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}

/* inline cell editor */
#cellEditor{
  position:absolute;display:none;z-index:200;
  background:#1e293b;border:2px solid var(--primary);
  border-radius:6px;padding:6px 8px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  display:none;flex-direction:column;gap:5px;min-width:140px
}
#cellEditor label{font-size:.7rem;color:var(--text-muted)}
#cellEditor input{
  width:100%;margin:0;padding:4px 6px;
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  border-radius:4px;color:white;font-family:'JetBrains Mono',monospace;
  font-size:.85rem;text-align:center
}
#cellEditor input:focus{outline:none;border-color:var(--primary)}
#cellEditor .editor-row{display:flex;gap:4px}
#cellEditor .editor-row button{padding:4px 8px;font-size:.75rem}

.hint{
  position:absolute;top:16px;right:16px;
  background:var(--bg-panel);padding:10px 14px;
  border-radius:8px;border:1px solid var(--border);
  font-size:.72rem;pointer-events:none;backdrop-filter:blur(12px);
  display:flex;flex-direction:column;gap:5px;color:var(--text-muted)
}
.hint b{color:var(--text-main)}
</style>
</head>
<body>
<div class="container">
<aside>
  <a href="btree.html" class="back-link">← B-Tree</a>
  <h1>⛓ Disjoint Sets</h1>
  <p class="subtitle">Linked-list representation</p>

  <div class="control-group">
    <div class="group-title">Theme</div>
    <div class="theme-selector">
      <button class="theme-btn active" data-theme="default">Blue</button>
      <button class="theme-btn" data-theme="ocean">Ocean</button>
      <button class="theme-btn" data-theme="sunset">Sunset</button>
      <button class="theme-btn" data-theme="forest">Forest</button>
      <button class="theme-btn" data-theme="cyber">Cyber</button>
      <button class="theme-btn" data-theme="amber">Amber</button>
    </div>
  </div>

  <hr class="sep">

  <div class="control-group">
    <div class="group-title">Sets</div>
    <div id="listSelector" class="list-selector"></div>
    <div class="btn-grid">
      <button class="btn-primary" id="newSetBtn">+ New Set</button>
      <button class="btn-danger" id="delSetBtn">– Del Set</button>
    </div>
  </div>

  <hr class="sep">

  <div class="control-group">
    <div class="group-title">Active set — add cell</div>
    <input type="text" id="cellKey" placeholder="key (e.g. x, 42, α)">
    <input type="text" id="cellLabel" placeholder="label above (e.g. head, rep)">
    <div class="btn-grid">
      <button class="btn-primary" id="addCellBtn">Append</button>
      <button id="addCellFrontBtn">Prepend</button>
      <button class="btn-danger" id="delLastBtn">Del Last</button>
      <button class="btn-danger btn-full" id="clearSetBtn">Clear Set</button>
    </div>
  </div>

  <hr class="sep">

  <div class="control-group">
    <div class="group-title">Representative &amp; last pointers</div>
    <div class="chk-row"><input type="checkbox" id="showRep" checked><label for="showRep">Show representative pointer (rep↑)</label></div>
    <div class="chk-row"><input type="checkbox" id="showLast" checked><label for="showLast">Show last pointer (last↑)</label></div>
    <div class="chk-row"><input type="checkbox" id="showNext" checked><label for="showNext">Show next (→) pointers</label></div>
    <div class="chk-row"><input type="checkbox" id="showSetPtr" checked><label for="showSetPtr">Show set pointer (↑ on each cell)</label></div>
    <div class="chk-row"><input type="checkbox" id="showNil" checked><label for="showNil">Show NIL at end</label></div>
  </div>

  <hr class="sep">

  <div class="control-group">
    <div class="group-title">Union (merge two sets)</div>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:7px">
      <select id="unionA" style="margin:0;flex:1"></select>
      <span style="color:var(--text-muted);font-size:.8rem">∪</span>
      <select id="unionB" style="margin:0;flex:1"></select>
    </div>
    <button class="btn-primary btn-full" id="unionBtn">Union (append B → A)</button>
  </div>

  <hr class="sep">

  <div class="control-group">
    <div class="group-title">Demo</div>
    <div class="btn-grid">
      <button class="btn-primary btn-full" id="demoBtn">Load CLRS demo</button>
      <button class="btn-danger btn-full" id="resetBtn">Reset all</button>
    </div>
  </div>

  <hr class="sep">

  <div class="control-group">
    <div class="group-title">Log</div>
    <div class="terminal-panel" id="termLog"><div class="terminal-line">Ready. Double-click a cell to edit.</div></div>
  </div>

  <div class="stats-panel">
    <div class="stat-item"><span class="stat-label">Sets</span><span class="stat-value" id="statSets">0</span></div>
    <div class="stat-item"><span class="stat-label">Elements</span><span class="stat-value" id="statElems">0</span></div>
  </div>
</aside>

<main id="canvasWrap">
  <canvas id="cvs"></canvas>
  <div class="toast" id="toast"></div>
  <div id="cellEditor">
    <label>Key</label><input id="edKey" type="text">
    <label>Label above</label><input id="edLabel" type="text">
    <div class="editor-row">
      <button class="btn-primary" id="edOk">OK</button>
      <button id="edCancel">Cancel</button>
    </div>
  </div>
  <div class="hint">
    <div><b>Double-click</b> a cell to edit key/label</div>
    <div><b>Drag</b> to pan · <b>Scroll</b> to zoom</div>
  </div>
</main>
</div>

<script>
// ============================================================
//  Disjoint-set linked-list visualizer
//  Each set = { id, color, cells:[{key,label}] }
// ============================================================

const cvs  = document.getElementById('cvs');
const ctx  = cvs.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const toastEl  = document.getElementById('toast');
const termEl   = document.getElementById('termLog');
const editorEl = document.getElementById('cellEditor');

// ─── layout constants ───────────────────────────────────────
const CW = 44;        // cell width  (each half of a double-link node)
const CH = 38;        // cell height
const R  = 5;         // corner radius
const ROW_GAP = 160;  // vertical gap between set rows
const SET_START_X = 60; // left margin for first node (head sentinel)

// ─── state ──────────────────────────────────────────────────
let sets = [];   // array of set objects
let activeSetId = null;

let offset = {x:0, y:0};
let zoom   = 1;
let isDragging = false;
let lastMouse  = {x:0, y:0};

// editing
let editNode = null; // {setId, cellIdx}

// palette for auto-assigning set colors
const PALETTE = [
  '#3b82f6','#06b6d4','#10b981','#f59e0b',
  '#f97316','#ec4899','#a855f7','#14b8a6',
  '#84cc16','#ef4444'
];
let paletteIdx = 0;

// ─── utility ────────────────────────────────────────────────
function uid(){return Math.random().toString(36).slice(2,8)}
function log(msg,type='info'){
  const d=document.createElement('div');
  d.className=`terminal-line ${type}`;d.textContent=msg;
  termEl.appendChild(d);termEl.scrollTop=termEl.scrollHeight;
}
function clearLog(){termEl.innerHTML=''}
function toast(msg,type='info'){
  toastEl.textContent=msg;
  toastEl.className=`toast ${type} show`;
  setTimeout(()=>toastEl.classList.remove('show'),2800);
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function nextColor(){
  const c=PALETTE[paletteIdx%PALETTE.length];paletteIdx++;return c;
}

// ─── set management ─────────────────────────────────────────
function newSet(name){
  const s={id:uid(),name:name||`S${sets.length+1}`,color:nextColor(),cells:[]};
  sets.push(s);
  if(!activeSetId)activeSetId=s.id;
  rebuildUI();draw();updateStats();
  log(`Created set ${s.name}`,'success');
  return s;
}

function deleteSet(id){
  const i=sets.findIndex(s=>s.id===id);
  if(i<0)return;
  const name=sets[i].name;
  sets.splice(i,1);
  if(activeSetId===id) activeSetId=sets.length?sets[0].id:null;
  rebuildUI();draw();updateStats();
  log(`Deleted set ${name}`,'warn');
}

function getActive(){return sets.find(s=>s.id===activeSetId)||null}

function addCell(s,key,label,front=false){
  if(!s)return;
  const cell={id:uid(),key:key||'·',label:label||''};
  if(front)s.cells.unshift(cell);
  else s.cells.push(cell);
  draw();updateStats();
  log(`Added "${cell.key}" to ${s.name}`,'success');
}

function delLast(s){
  if(!s||s.cells.length===0){log('Set is empty','error');return}
  const c=s.cells.pop();
  draw();updateStats();
  log(`Removed "${c.key}" from ${s.name}`,'warn');
}

function clearSet(s){
  if(!s)return;
  s.cells=[];
  draw();updateStats();
  log(`Cleared ${s.name}`,'warn');
}

function unionSets(idA,idB){
  const A=sets.find(s=>s.id===idA);
  const B=sets.find(s=>s.id===idB);
  if(!A||!B||A===B){log('Invalid union operands','error');return}
  A.cells=[...A.cells,...B.cells];
  sets=sets.filter(s=>s.id!==idB);
  if(activeSetId===idB)activeSetId=idA;
  rebuildUI();draw();updateStats();
  log(`Union: ${B.name} appended to ${A.name} (${A.cells.length} elements)`,'success');
  toast(`Union complete → ${A.name}`,'success');
}

// ─── UI rebuild ─────────────────────────────────────────────
function rebuildUI(){
  // pills
  const sel=document.getElementById('listSelector');
  sel.innerHTML='';
  sets.forEach(s=>{
    const p=document.createElement('span');
    p.className='list-pill'+(s.id===activeSetId?' active':'');
    p.textContent=s.name;
    p.style.borderColor=s.color;
    if(s.id===activeSetId)p.style.background=s.color+'33';
    p.addEventListener('click',()=>{activeSetId=s.id;rebuildUI();draw()});
    sel.appendChild(p);
  });

  // union selects
  ['unionA','unionB'].forEach(id=>{
    const el=document.getElementById(id);
    const prev=el.value;
    el.innerHTML='';
    sets.forEach(s=>{
      const o=document.createElement('option');
      o.value=s.id;o.textContent=s.name;el.appendChild(o);
    });
    if(prev)el.value=prev;
  });
}

function updateStats(){
  document.getElementById('statSets').textContent=sets.length;
  document.getElementById('statElems').textContent=sets.reduce((a,s)=>a+s.cells.length,0);
}

// ─── DRAWING ────────────────────────────────────────────────
function setRowY(setIdx){ return 120 + setIdx*ROW_GAP }

// Returns bounding boxes for every rendered element
// Returns: [{type:'cell', setId, cellIdx, x,y,w,h}, {type:'head', setId, x,y,w,h}, ...]
let hitMap = [];

function draw(){
  cvs.width  = wrap.clientWidth;
  cvs.height = wrap.clientHeight;
  const bg=cssVar('--bg-dark')||'#0f172a';
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,cvs.width,cvs.height);

  hitMap=[];
  if(!sets.length){updateStats();return}

  ctx.save();
  ctx.translate(cvs.width/2+offset.x, offset.y+40);
  ctx.scale(zoom,zoom);

  const showRep  = document.getElementById('showRep').checked;
  const showLast = document.getElementById('showLast').checked;
  const showNext = document.getElementById('showNext').checked;
  const showSetP = document.getElementById('showSetPtr').checked;
  const showNil  = document.getElementById('showNil').checked;

  // total width of all sets combined (for centering)
  const maxCells=sets.reduce((a,s)=>Math.max(a,s.cells.length),0);

  sets.forEach((s,si)=>{
    const y=setRowY(si);
    drawSet(s,si,y,{showRep,showLast,showNext,showSetP,showNil});
  });

  ctx.restore();
  updateStats();
}

function drawSet(s,si,y,opts){
  const primary=cssVar('--primary')||'#3b82f6';
  const color=s.color;
  const cells=s.cells;

  // Head sentinel position
  const headX = -( (cells.length+1)*( CW*2+6 ) )/2;
  const headW = CW*2;
  const headH = CH;

  // ── draw set name label (left) ──
  ctx.font='bold 13px "STIX Two Text", serif';
  ctx.fillStyle=color;
  ctx.textAlign='right';
  ctx.textBaseline='middle';
  ctx.fillText(s.name, headX-14, y+CH/2);

  // ── head sentinel (∅) ──
  drawSentinel(headX, y, headW, headH, '∅', color, si, -1, s.id);

  let rx=headX+headW+6; // running x after head

  // ── cells ──
  cells.forEach((cell,ci)=>{
    // double-link node: [key | next-ptr]
    const nx=rx;
    const nodeW=CW*2;

    // record hit
    hitMap.push({type:'cell',setId:s.id,cellIdx:ci,x:nx,y,w:nodeW,h:CH});

    // bg
    roundRect(ctx,nx,y,nodeW,CH,R);
    const isActive=(s.id===activeSetId);
    ctx.fillStyle=isActive?`${color}18`:'rgba(15,23,42,0.88)';
    ctx.fill();
    ctx.strokeStyle=color;
    ctx.lineWidth=1.8;
    ctx.stroke();

    // divider between key and ptr half
    ctx.beginPath();
    ctx.moveTo(nx+CW,y+5);ctx.lineTo(nx+CW,y+CH-5);
    ctx.strokeStyle=`${color}55`;ctx.lineWidth=1;ctx.stroke();

    // key text (left half)
    ctx.font='bold 15px "STIX Two Text",serif';
    ctx.fillStyle='#f1f5f9';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(cell.key, nx+CW/2, y+CH/2);

    // right half: draw a small arrow symbol →
    ctx.font='11px "STIX Two Text",serif';
    ctx.fillStyle=`${color}bb`;
    ctx.fillText('→', nx+CW+CW/2, y+CH/2);

    // label above
    if(cell.label){
      ctx.font='12px "STIX Two Text",serif';
      ctx.fillStyle=color;
      ctx.textAlign='center';
      ctx.textBaseline='bottom';
      ctx.fillText(cell.label, nx+CW/2, y-5);
    }

    // set pointer upward arrow (↑ from bottom center to point below node)
    if(opts.showSetP){
      drawSetPointer(nx+CW/2, y+CH, color);
    }

    rx=nx+nodeW+6;
  });

  // ── nil / end cap ──
  if(opts.showNil){
    drawNilSymbol(rx, y, CH, color);
    // right arrow from last cell to nil
    if(cells.length>0 && opts.showNext){
      arrowLine(rx-6+2, y+CH/2, rx, y+CH/2, color);
    }
  }

  // ── next arrows between cells ──
  if(opts.showNext){
    for(let ci=0;ci<cells.length;ci++){
      const fromX = headX + headW + 6 + ci*(CW*2+6) + CW*2 + 4;
      const toX   = headX + headW + 6 + (ci+1)*(CW*2+6);
      if(ci<cells.length-1){
        arrowLine(fromX+2, y+CH/2, toX-2, y+CH/2, color);
      }
    }
    // head → first cell
    if(cells.length>0){
      arrowLine(headX+headW+2, y+CH/2, headX+headW+6-2, y+CH/2, color);
    } else if(opts.showNil){
      // head → nil
      arrowLine(headX+headW+2, y+CH/2, rx-2, y+CH/2, color);
    }
  }

  // ── representative pointer ──
  if(opts.showRep && cells.length>0){
    // rep points from head down to the first cell (leftmost)
    const repX = headX + headW/2;
    const repTargetX = headX + headW + 6 + CW/2; // first cell center
    // draw a curved arc below the row
    drawBelowArc(repX, y+CH, repTargetX, y+CH, color+'cc', 'rep', -40);
  }

  // ── last pointer ──
  if(opts.showLast && cells.length>0){
    const lastCellX=headX+headW+6+(cells.length-1)*(CW*2+6)+CW/2;
    const headCX=headX+headW*0.75;
    drawBelowArc(headCX, y+CH, lastCellX, y+CH, '#fbbf24cc', 'last', -70);
  }
}

// ── sentinels ──
function drawSentinel(x,y,w,h,text,color,si,ci,setId){
  roundRect(ctx,x,y,w,h,R);
  ctx.fillStyle='rgba(15,23,42,0.7)';ctx.fill();
  ctx.strokeStyle=`${color}88`;ctx.lineWidth=1.5;ctx.stroke();
  // italic math font
  ctx.font='italic 17px "STIX Two Text",serif';
  ctx.fillStyle=`${color}cc`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x+w/2,y+h/2);
  hitMap.push({type:'sentinel',setId,cellIdx:ci,x,y,w,h});
}

// ── NIL symbol (resistor-like zigzag) ──
function drawNilSymbol(x, y, h, color){
  const cx=x+16, cy=y+h/2;
  const bw=24, bh=16;

  // downward arrow from previous cell bottom-right corner
  ctx.beginPath();
  ctx.moveTo(cx, y-8);
  ctx.lineTo(cx, cy-bh/2-4);
  arrowHead(ctx, cx, cy-bh/2-4, 'down');
  ctx.strokeStyle=color+'99';ctx.lineWidth=1.5;ctx.stroke();

  // box
  ctx.strokeStyle=color+'cc';ctx.lineWidth=1.5;
  ctx.fillStyle='rgba(239,68,68,0.12)';
  ctx.beginPath();
  ctx.rect(cx-bw/2, cy-bh/2, bw, bh);
  ctx.fill();ctx.stroke();

  // zigzag inside (resistor)
  const zx=cx-9, zy=cy, zw=18, segs=5;
  const sw=zw/segs;
  ctx.beginPath();ctx.moveTo(zx,zy);
  for(let i=0;i<segs;i++){
    ctx.lineTo(zx+i*sw+sw/2, zy+(i%2===0?-5:5));
    ctx.lineTo(zx+(i+1)*sw, zy);
  }
  ctx.strokeStyle=color+'dd';ctx.lineWidth=1.2;ctx.stroke();

  // NIL text below
  ctx.font='bold 10px "JetBrains Mono",monospace';
  ctx.fillStyle=`${color}99`;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText('NIL', cx, cy+bh/2+4);
}

// ── set pointer (small downward-pointing stub) ──
function drawSetPointer(cx, bottomY, color){
  const stubLen=18;
  ctx.beginPath();
  ctx.moveTo(cx, bottomY+2);
  ctx.lineTo(cx, bottomY+stubLen);
  ctx.strokeStyle=color+'88';ctx.lineWidth=1.3;
  ctx.setLineDash([3,2]);ctx.stroke();ctx.setLineDash([]);
  // mini arrowhead down
  ctx.beginPath();
  ctx.moveTo(cx-4, bottomY+stubLen-5);
  ctx.lineTo(cx, bottomY+stubLen);
  ctx.lineTo(cx+4, bottomY+stubLen-5);
  ctx.strokeStyle=color+'88';ctx.lineWidth=1.2;ctx.stroke();
}

// ── curved arc below the row for rep/last ──
function drawBelowArc(x1,y1,x2,y2,color,label,bend){
  const mx=(x1+x2)/2, my=y1-bend;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.quadraticCurveTo(mx,my,x2,y2);
  ctx.strokeStyle=color;ctx.lineWidth=1.5;
  ctx.setLineDash([5,3]);ctx.stroke();ctx.setLineDash([]);
  // arrowhead at end
  const dx=x2-mx, dy=y2-my;
  const ang=Math.atan2(dy,dx);
  const al=8;
  ctx.beginPath();
  ctx.moveTo(x2-al*Math.cos(ang-0.35),y2-al*Math.sin(ang-0.35));
  ctx.lineTo(x2,y2);
  ctx.lineTo(x2-al*Math.cos(ang+0.35),y2-al*Math.sin(ang+0.35));
  ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
  // label near midpoint
  ctx.font='italic 11px "STIX Two Text",serif';
  ctx.fillStyle=color;
  ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText(label, mx, my-3);
}

function arrowLine(x1,y1,x2,y2,color){
  if(Math.abs(x2-x1)<2)return;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  ctx.strokeStyle=color+'bb';ctx.lineWidth=1.4;ctx.stroke();
  // arrowhead
  const ang=Math.atan2(y2-y1,x2-x1), al=7;
  ctx.beginPath();
  ctx.moveTo(x2-al*Math.cos(ang-0.4),y2-al*Math.sin(ang-0.4));
  ctx.lineTo(x2,y2);
  ctx.lineTo(x2-al*Math.cos(ang+0.4),y2-al*Math.sin(ang+0.4));
  ctx.strokeStyle=color+'bb';ctx.lineWidth=1.4;ctx.stroke();
}

function arrowHead(ctx,x,y,dir){
  const al=6;
  if(dir==='down'){
    ctx.moveTo(x-al,y-al);ctx.lineTo(x,y);ctx.lineTo(x+al,y-al);
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ─── HIT TEST ────────────────────────────────────────────────
function hitTest(e){
  const rect=cvs.getBoundingClientRect();
  const mx=(e.clientX-rect.left-cvs.width/2-offset.x)/zoom;
  const my=(e.clientY-rect.top-offset.y-40)/zoom;
  for(const h of hitMap){
    if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h) return h;
  }
  return null;
}

// ─── CELL EDITOR ─────────────────────────────────────────────
cvs.addEventListener('dblclick',e=>{
  const h=hitTest(e);
  if(!h||h.type!=='cell')return;
  editNode={setId:h.setId,cellIdx:h.cellIdx};

  const s=sets.find(s=>s.id===h.setId);
  const cell=s.cells[h.cellIdx];
  document.getElementById('edKey').value=cell.key;
  document.getElementById('edLabel').value=cell.label||'';

  const rect=cvs.getBoundingClientRect();
  const sx=h.x*zoom+cvs.width/2+offset.x+rect.left;
  const sy=h.y*zoom+(offset.y+40)+rect.top-30;
  editorEl.style.left=`${sx}px`;
  editorEl.style.top=`${sy}px`;
  editorEl.style.display='flex';
  document.getElementById('edKey').focus();
});

document.getElementById('edOk').addEventListener('click',commitEdit);
document.getElementById('edCancel').addEventListener('click',cancelEdit);
document.getElementById('edKey').addEventListener('keydown',e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')cancelEdit()});
document.getElementById('edLabel').addEventListener('keydown',e=>{if(e.key==='Enter')commitEdit();if(e.key==='Escape')cancelEdit()});

function commitEdit(){
  if(!editNode)return;
  const s=sets.find(s=>s.id===editNode.setId);
  if(!s)return;
  const cell=s.cells[editNode.cellIdx];
  const nk=document.getElementById('edKey').value.trim();
  const nl=document.getElementById('edLabel').value.trim();
  if(nk){
    log(`Edited cell: "${cell.key}" → "${nk}"${nl?` [${nl}]`:''}`,'success');
    cell.key=nk; cell.label=nl;
  }
  cancelEdit();draw();
}
function cancelEdit(){
  editorEl.style.display='none';
  editNode=null;
}

// ─── PAN & ZOOM ──────────────────────────────────────────────
wrap.addEventListener('mousedown',e=>{isDragging=true;lastMouse={x:e.clientX,y:e.clientY}});
window.addEventListener('mouseup',()=>isDragging=false);
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  offset.x+=e.clientX-lastMouse.x;
  offset.y+=e.clientY-lastMouse.y;
  lastMouse={x:e.clientX,y:e.clientY};
  draw();
});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const dir=e.deltaY>0?-1:1;
  const nz=zoom+dir*0.08;
  if(nz>=0.15&&nz<=4){zoom=nz;draw();}
},{passive:false});
window.addEventListener('resize',draw);

// ─── CHECKBOX LISTENERS ──────────────────────────────────────
['showRep','showLast','showNext','showSetPtr','showNil'].forEach(id=>{
  document.getElementById(id).addEventListener('change',draw);
});

// ─── CONTROL PANEL ───────────────────────────────────────────
document.querySelectorAll('.theme-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t=btn.dataset.theme;
    if(t==='default') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme',t);
    draw();
  });
});

document.getElementById('newSetBtn').addEventListener('click',()=>{
  newSet();toast(`New set created`,'success');
});
document.getElementById('delSetBtn').addEventListener('click',()=>{
  if(!activeSetId){toast('No active set','error');return}
  deleteSet(activeSetId);
  toast('Set deleted','warn');
});
document.getElementById('addCellBtn').addEventListener('click',()=>{
  const s=getActive();
  if(!s){toast('Create a set first','error');return}
  const key=document.getElementById('cellKey').value.trim()||'·';
  const lbl=document.getElementById('cellLabel').value.trim();
  addCell(s,key,lbl,false);
  document.getElementById('cellKey').value='';
  document.getElementById('cellLabel').value='';
});
document.getElementById('addCellFrontBtn').addEventListener('click',()=>{
  const s=getActive();
  if(!s){toast('Create a set first','error');return}
  const key=document.getElementById('cellKey').value.trim()||'·';
  const lbl=document.getElementById('cellLabel').value.trim();
  addCell(s,key,lbl,true);
  document.getElementById('cellKey').value='';
  document.getElementById('cellLabel').value='';
});
document.getElementById('delLastBtn').addEventListener('click',()=>delLast(getActive()));
document.getElementById('clearSetBtn').addEventListener('click',()=>{
  clearSet(getActive());toast('Set cleared','warn');
});
document.getElementById('unionBtn').addEventListener('click',()=>{
  const a=document.getElementById('unionA').value;
  const b=document.getElementById('unionB').value;
  if(a===b){toast('Select two different sets','error');return}
  unionSets(a,b);
});
document.getElementById('cellKey').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('addCellBtn').click();
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  sets=[];activeSetId=null;paletteIdx=0;
  offset={x:0,y:0};zoom=1;
  clearLog();log('Reset.','warn');
  rebuildUI();draw();updateStats();
  toast('Reset','warn');
});

// ─── CLRS DEMO ───────────────────────────────────────────────
document.getElementById('demoBtn').addEventListener('click',()=>{
  sets=[];activeSetId=null;paletteIdx=0;
  clearLog();

  // S1: {a,b,c,d,e,f} — representative = a, last = f
  const s1=newSet('S₁');
  [
    {key:'a',label:'rep'},
    {key:'b',label:''},
    {key:'c',label:''},
    {key:'d',label:''},
    {key:'e',label:''},
    {key:'f',label:'last'},
  ].forEach(c=>addCell(s1,c.key,c.label));
  activeSetId=s1.id;

  // S2: {g,h}
  const s2=newSet('S₂');
  [{key:'g',label:'rep'},{key:'h',label:'last'}].forEach(c=>addCell(s2,c.key,c.label));

  // S3: {x,y,z}
  const s3=newSet('S₃');
  [{key:'x',label:'rep'},{key:'y',label:''},{key:'z',label:'last'}].forEach(c=>addCell(s3,c.key,c.label));

  activeSetId=s1.id;
  offset={x:0,y:0};zoom=1;
  rebuildUI();draw();updateStats();
  toast('CLRS demo loaded','success');
  log('Demo: S₁={a…f}, S₂={g,h}, S₃={x,y,z}','success');
});

// ─── INIT ────────────────────────────────────────────────────
rebuildUI();
draw();
updateStats();
</script>
